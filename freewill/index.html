<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Illusion of Free Will</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #f2ecff; font-family: Inter, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { display: block; background: #000; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 24px 22px; display: flex; gap: 16px; align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0)); transition: opacity .5s ease; font: 300 12px/1 Inter, sans-serif; letter-spacing: .12em; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui button { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 13px; flex: none; }
  #scrub { flex: 1; accent-color: #c77dff; min-width: 0; }
  #time { min-width: 110px; text-align: right; opacity: .8; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <button id="play" aria-label="Play / pause">❚❚</button>
  <input id="scrub" type="range" min="0" max="50" step="0.01" value="0" aria-label="Timeline">
  <span id="time">00.00 / 50.00</span>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   THE ILLUSION OF FREE WILL — Who Is Really in Control?
   50 s deterministic motion-graphics film. renderFrame(t) is a pure
   function of time. Each scene is drawn into its own layer with its own
   camera; layers cross-fade, so transitions are continuous.
   ===================================================================== */
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
const DURATION = 50; window.__DURATION = DURATION;
const LW = 1920, LH = 1080;
const HI = RENDER;

const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d')]; };
const [fg, fctx] = mk(), [lay, lctx] = mk();
let W = 0, H = 0, S = 1, FOCAL = 1, C = lctx;

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const sm5 = k => { k = clamp(k); return k * k * k * (k * (k * 6 - 15) + 10); };
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const win = (t, a, b, fi, fo) => ss(a, a + fi, t) * (1 - ss(b - fo, b, t));
const frac = x => x - Math.floor(x);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(R) { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); }
const hash = n => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);
function chan(keys, t, e = ease) { if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) { const [t0, v0] = keys[i], [t1, v1] = keys[i + 1]; if (t <= t1) return lerp(v0, v1, e((t - t0) / (t1 - t0))); }
  return keys[keys.length - 1][1]; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a).toFixed(4)})`;
const mixc = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];

/* ---------- palette ---------- */
const COL = { white: [255, 250, 255], violet: [160, 90, 255], crimson: [235, 40, 80], blue: [60, 135, 255], turq: [40, 225, 215], gold: [255, 200, 85],
  magenta: [240, 60, 205], orange: [255, 140, 60], ice: [205, 230, 255], red: [255, 60, 70], dblue: [70, 150, 255], rose: [255, 120, 170] };
const PAL = [
  ['#0c0418', '#3b0f5e', '#8e2b7e', '#e2622f', '#ffb35c'].map(hex),   // I   purple / orange clouds
  ['#03020f', '#170a3e', '#2e1670', '#0e5a78', '#1fc2bf'].map(hex),   // II  deep violet ↔ turquoise
  ['#05040f', '#1a0d3d', '#3d1468', '#16307a', '#8a2457'].map(hex),   // III dream room
  ['#0a0106', '#3a0418', '#8a0f33', '#4a1478', '#c22f78'].map(hex),   // IV  crimson / violet
  ['#070416', '#2b1366', '#127f8f', '#e0a43a', '#ffe59a'].map(hex),   // V   gold / turquoise / violet
];
// scene presence (layers) and background weights
function sceneAlpha(t) { return [
  1 - ss(9.3, 10.3, t),
  ss(9.15, 10.2, t) * (1 - ss(18.5, 19.5, t)),
  ss(18.9, 20.0, t) * (1 - ss(28.3, 29.4, t)),
  ss(29.0, 30.0, t) * (1 - ss(39.6, 40.8, t)),
  ss(39.4, 40.6, t) ]; }
function bgWeights(t) { const w = [1 - ss(8.6, 10, t), ss(8.6, 10, t) * (1 - ss(18.3, 19.8, t)), ss(18.3, 19.8, t) * (1 - ss(28, 29.8, t)), ss(28, 29.8, t) * (1 - ss(38.8, 41, t)), ss(38.8, 41, t)];
  const s = w.reduce((a, b) => a + b, 0) || 1; return w.map(v => v / s); }

/* ---------- sprites ---------- */
let GLOW = {}, NOISE;
function makeGlow(rgb, size) { const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (let k = 0; k <= 16; k++) { const x = k / 16, a = Math.exp(-x * x * 5.2) * (x >= 1 ? 0 : 1), wm = Math.exp(-x * x * 22);
    gr.addColorStop(x, `rgba(${Math.round(lerp(rgb[0], 255, wm))},${Math.round(lerp(rgb[1], 255, wm))},${Math.round(lerp(rgb[2], 255, wm))},${a.toFixed(4)})`); }
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c; }
function makeNoise() { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const id = g.createImageData(256, 256); const R = rng(77);
  for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); return c; }
function glowPx(x, y, r, a, key) { if (a <= 0.002 || r <= 0.1) return; C.globalAlpha = Math.min(1, a); C.drawImage(GLOW[key], x - r, y - r, 2 * r, 2 * r); }
function glow(x, y, rL, a, key) { glowPx(x, y, rL * S, a, key); }

/* ---------- camera ---------- */
const cam = { tx: 0, ty: 0, tz: 0, dist: 5, cy: 1, sy: 0, cp: 1, sp: 0, ox: 0, oy: 0 };
function setCam(tx, ty, tz, dist, yaw, pitch) { cam.tx = tx; cam.ty = ty; cam.tz = tz; cam.dist = dist; cam.cy = Math.cos(yaw); cam.sy = Math.sin(yaw); cam.cp = Math.cos(pitch); cam.sp = Math.sin(pitch); }
let PX = 0, PY = 0, PD = 0;
function project(x, y, z) {
  const dx = x - cam.tx, dy = y - cam.ty, dz = z - cam.tz;
  const x1 = dx * cam.cy - dz * cam.sy, z1 = dx * cam.sy + dz * cam.cy;
  const y2 = dy * cam.cp - z1 * cam.sp, z2 = dy * cam.sp + z1 * cam.cp;
  const d = cam.dist - z2; if (d < 0.08) return false;
  PD = d; PX = W * 0.5 + cam.ox * S + FOCAL * x1 / d; PY = H * 0.5 + cam.oy * S - FOCAL * y2 / d; return true; }

/* ---------- batched glowing lines ---------- */
class Lines {
  constructor() { this.b = new Map(); }
  add(x1, y1, x2, y2, a, key) { if (a < 0.006) return; const q = Math.min(11, Math.floor(a * 12)); const k = key + '|' + q; let arr = this.b.get(k); if (!arr) { arr = []; this.b.set(k, arr); } arr.push(x1, y1, x2, y2); }
  add3(p, q, a, key) { if (a < 0.006) return; if (!project(p[0], p[1], p[2])) return; const x1 = PX, y1 = PY; if (!project(q[0], q[1], q[2])) return; this.add(x1, y1, PX, PY, a, key); }
  flush(passes, scale = 1) {
    C.lineCap = 'round'; C.globalAlpha = 1;
    for (const [w, am, toWhite] of passes) { C.lineWidth = Math.max(0.6, w * S);
      for (const [k, arr] of this.b) { const [key, q] = k.split('|'); const a = (+q + 0.5) / 12 * am * scale; if (a < 0.003) continue;
        C.strokeStyle = rgba(mixc(COL[key], [255, 255, 255], toWhite), a); C.beginPath();
        for (let i = 0; i < arr.length; i += 4) { C.moveTo(arr[i], arr[i + 1]); C.lineTo(arr[i + 2], arr[i + 3]); } C.stroke(); } }
    this.b.clear();
  }
}
const GL = [[9, 0.06, 0], [3.2, 0.2, 0.1], [1.1, 0.75, 0.6]];
function poly3(pts, a, key, passes = GL, closed = false) { const L = new Lines(); const n = pts.length; for (let i = 0; i < n - (closed ? 0 : 1); i++) L.add3(pts[i], pts[(i + 1) % n], a, key); L.flush(passes); }

/* ---------- background ---------- */
const [bgS, bgSc] = mk(), [bgM, bgMc] = mk(); const BW = 240, BH = 135; bgS.width = BW; bgS.height = BH; let bgData = null;
function ramp(pal, v) { const n = pal.length - 1, f = clamp(v) * n, i = Math.min(n - 1, Math.floor(f)), k = f - i, a = pal[i], b = pal[i + 1]; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
function background(t, wts, fade, focus) {
  if (!bgData) bgData = bgSc.createImageData(BW, BH); const d = bgData.data;
  const act = []; wts.forEach((w, i) => { if (w > 0.002) act.push([w, PAL[i]]); });
  const [fx, fy] = focus;
  for (let y = 0; y < BH; y++) { const v = y / BH;
    for (let x = 0; x < BW; x++) { const u = x / BW * 1.778;
      const q1 = Math.sin(u * 1.9 + t * 0.21) + Math.sin(v * 3.1 - t * 0.17 + u * 1.2);
      const q2 = Math.sin(v * 2.4 + t * 0.14 + q1 * 0.9) + 0.6 * Math.sin(u * 2.7 - t * 0.12 + q1 * 0.4);
      const f = 0.5 + 0.5 * Math.sin(u * 1.4 + v * 1.3 + q1 * 1.05 + q2 * 0.85 + t * 0.19 + 0.7 * Math.sin(t * 0.11));
      const band = Math.pow(0.5 + 0.5 * Math.sin((u * 2.6 - v * 1.8) * 2.2 + q1 * 2.2 - t * 0.6), 10);
      const cloud = 0.5 + 0.5 * Math.sin(u * 4.1 + q2 * 2.1 - t * 0.25) * Math.sin(v * 5.3 + q1 * 1.4 + t * 0.2);
      const dx = (x / BW - fx) * 1.778, dy = v - fy, rr = dx * dx + dy * dy;
      const lum = (0.36 + 0.26 * cloud) * (0.66 + 0.55 * Math.exp(-rr / 0.2)) * (1 - 0.5 * Math.min(1, rr * 0.8));
      let r = 0, g = 0, b = 0;
      for (const [w, pal] of act) { const c = ramp(pal, f * 0.8 + 0.1 * cloud), hi = pal[pal.length - 1];
        r += w * (c[0] * lum + hi[0] * band * 0.22); g += w * (c[1] * lum + hi[1] * band * 0.22); b += w * (c[2] * lum + hi[2] * band * 0.22); }
      const i = (y * BW + x) * 4; d[i] = r * fade; d[i + 1] = g * fade; d[i + 2] = b * fade; d[i + 3] = 255; } }
  bgSc.putImageData(bgData, 0, 0);
  bgMc.filter = 'blur(3px)'; bgMc.drawImage(bgS, -8, -8, bgM.width + 16, bgM.height + 16); bgMc.filter = 'none';
  ctx.imageSmoothingQuality = 'high'; ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.drawImage(bgM, 0, 0, W, H);
}
function godRays(g, x, y, col, a, n, len, t, seed) {
  if (a <= 0.005) return; g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < n; k++) { const h = hash(seed + k * 3.1), an = -Math.PI / 2 + (h - 0.5) * 2.6 + 0.08 * Math.sin(t * 0.3 + k);
    const wd = 0.03 + 0.06 * hash(seed + k * 7.7), L = len * S * (0.6 + 0.6 * hash(seed + k * 1.3)), aa = a * (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.7 + k * 1.9)));
    const gr = g.createRadialGradient(x, y, 0, x, y, L); gr.addColorStop(0, rgba(col, 0.22 * aa)); gr.addColorStop(1, rgba(col, 0));
    g.fillStyle = gr; g.beginPath(); g.moveTo(x, y); g.arc(x, y, L, an - wd, an + wd); g.closePath(); g.fill(); }
}

/* ---------- the human figure (articulated silhouette) ---------- */
function pose(o = {}) {
  const w = o.walk || 0, wa = o.walkAmt || 0, out = o.out || 0, bob = (o.bob || 0) + Math.abs(Math.sin(w)) * 0.018 * wa;
  const J = { bob };
  const arm = (side, reach, swing) => {
    const sh = [0.198 * side, 1.415 + bob];
    const a = lerp(0.1 + out * 0.5 + swing, 2.25, reach), bend = lerp(0.12 + out * 0.15, 0.05, reach);
    const el = [sh[0] + 0.3 * Math.sin(a) * side, sh[1] - 0.3 * Math.cos(a)];
    const wr = [el[0] + 0.27 * Math.sin(a + bend) * side, el[1] - 0.27 * Math.cos(a + bend)];
    const hd = [wr[0] + 0.08 * Math.sin(a + bend) * side, wr[1] - 0.08 * Math.cos(a + bend)];
    return { sh, el, wr, hd };
  };
  const leg = (side, lift) => {
    const hp = [0.092 * side, 0.92 + bob], sp = 0.03 + out * 0.06;
    const kn = [hp[0] + 0.45 * Math.sin(sp) * side, hp[1] - 0.45 * Math.cos(sp) + lift * 0.05];
    const an = [kn[0] + 0.02 * side, 0.08 + lift * 0.11 + (o.float ? bob + 0.02 : 0)];
    return { hp, kn, an };
  };
  const sw = Math.sin(w) * wa;
  J.R = arm(1, o.reachR || 0, -0.04 * sw); J.L = arm(-1, o.reachL || 0, 0.04 * sw);
  J.LR = leg(1, Math.max(0, sw)); J.LL = leg(-1, Math.max(0, -sw));
  return J;
}
function figurePath(g, X, Y, sc, J, piece) {
  const P = (x, y) => [X + x * sc, Y - y * sc]; const b = J.bob; const cut = () => { if (piece) { piece(); g.beginPath(); } };
  g.beginPath();
  // head + neck
  let [hx, hy] = P(0, 1.635 + b); g.ellipse(hx, hy, 0.093 * sc, 0.118 * sc, 0, 0, Math.PI * 2);
  let p = P(-0.05, 1.54 + b), q = P(0.05, 1.38 + b); g.rect(p[0], p[1], q[0] - p[0], q[1] - p[1]); cut();
  // torso
  const T = [[-0.235, 1.41], [-0.215, 1.30], [-0.155, 1.10], [-0.145, 1.0], [-0.18, 0.9], [-0.1, 0.84], [0, 0.82], [0.1, 0.84], [0.18, 0.9], [0.145, 1.0], [0.155, 1.10], [0.215, 1.30], [0.235, 1.41], [0.12, 1.465], [0, 1.47], [-0.12, 1.465]];
  p = P(T[0][0], T[0][1] + b); g.moveTo(p[0], p[1]);
  for (let i = 1; i <= T.length; i++) { const a = T[i % T.length], c = T[(i + 1) % T.length]; const m = P((a[0] + c[0]) / 2, (a[1] + c[1]) / 2 + b), ap = P(a[0], a[1] + b); g.quadraticCurveTo(ap[0], ap[1], m[0], m[1]); }
  g.closePath(); cut();
  const cap = (a, c, wa, wc) => { const A = P(a[0], a[1]), B = P(c[0], c[1]); const dx = B[0] - A[0], dy = B[1] - A[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
    const ra = wa * sc / 2, rc = wc * sc / 2;
    g.moveTo(A[0] + nx * ra, A[1] + ny * ra); g.lineTo(B[0] + nx * rc, B[1] + ny * rc); g.lineTo(B[0] - nx * rc, B[1] - ny * rc); g.lineTo(A[0] - nx * ra, A[1] - ny * ra); g.closePath();
    g.moveTo(B[0] + rc, B[1]); g.arc(B[0], B[1], rc, 0, Math.PI * 2); g.moveTo(A[0] + ra, A[1]); g.arc(A[0], A[1], ra, 0, Math.PI * 2); cut(); };
  for (const A of [J.R, J.L]) { cap(A.sh, A.el, 0.1, 0.075); cap(A.el, A.wr, 0.072, 0.052); cap(A.wr, A.hd, 0.06, 0.045); }
  for (const L of [J.LR, J.LL]) { cap(L.hp, L.kn, 0.155, 0.1); cap(L.kn, L.an, 0.1, 0.062); const f = P(L.an[0] * 1.15, L.an[1] - 0.05); g.moveTo(f[0] + 0.055 * sc, f[1]); g.ellipse(f[0], f[1], 0.055 * sc, 0.04 * sc, 0, 0, Math.PI * 2); cut(); }
}
// st: {a, glow, blur, body:[top,bottom], lum (additive luminous body)}
const [figC, figG] = mk();
function drawFigure(X, Y, sc, J, st) {
  const a = st.a; if (a <= 0.003) return; const g = figG;
  const pad = (st.glow ? Math.min(160, st.blur || 40) * S * 2 : 0) + 4;
  const x0 = Math.max(0, Math.floor(X - 0.6 * sc - pad)), x1 = Math.min(W, Math.ceil(X + 0.6 * sc + pad));
  const y0 = Math.max(0, Math.floor(Y - 1.85 * sc - pad)), y1 = Math.min(H, Math.ceil(Y + 0.12 * sc + pad));
  if (x1 <= x0 || y1 <= y0) return;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.clearRect(x0, y0, x1 - x0, y1 - y0);
  if (st.glow && st.blur) { g.shadowColor = rgba(st.glow, 0.9); g.shadowBlur = Math.min(160, st.blur) * S; g.fillStyle = rgba(st.glow, 1); figurePath(g, X, Y, sc, J, () => g.fill()); g.shadowBlur = 0; g.shadowColor = 'rgba(0,0,0,0)'; }
  const gr = g.createLinearGradient(0, Y - 1.8 * sc, 0, Y); gr.addColorStop(0, rgba(st.body[0], 1)); gr.addColorStop(1, rgba(st.body[1], 1));
  g.fillStyle = gr; figurePath(g, X, Y, sc, J, () => g.fill());
  C.save(); C.globalCompositeOperation = st.lum ? 'lighter' : 'source-over'; C.globalAlpha = a; C.drawImage(figC, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0); C.restore();
}

/* ---------- realistic face profile (facing right), unit ≈ head height ---------- */
const PROF = [[-0.28, 0.78], [-0.24, 0.5], [-0.3, 0.33], [-0.42, 0.14], [-0.45, -0.1], [-0.38, -0.33], [-0.2, -0.5], [0.04, -0.54], [0.22, -0.45], [0.31, -0.28],
  [0.335, -0.12], [0.35, -0.045], [0.322, 0.02], [0.37, 0.12], [0.43, 0.2], [0.445, 0.225], [0.405, 0.255], [0.352, 0.268], [0.368, 0.305], [0.375, 0.33],
  [0.35, 0.348], [0.368, 0.372], [0.355, 0.4], [0.33, 0.418], [0.352, 0.47], [0.33, 0.525], [0.25, 0.555], [0.12, 0.56], [0.075, 0.62], [0.07, 0.78]];
function profilePath(g, X, Y, sc, flip) {
  const pts = PROF.map(([x, y]) => [X + x * sc * flip, Y + y * sc]); const n = pts.length;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < n - 1; i++) { const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    g.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]); }
  g.closePath();
}

/* ---------- world data ---------- */
let MOTES, DUST, PATHS, GEOS, NN, NE, S3O, TREE, DISS, QM;
const POLY = {
