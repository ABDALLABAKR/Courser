<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Double-Slit Experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #eef3ff; font-family: Inter, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { display: block; background: #000; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 24px 22px; display: flex; gap: 16px; align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0)); transition: opacity .5s ease; font: 300 12px/1 Inter, sans-serif; letter-spacing: .12em; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui button { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 13px; flex: none; }
  #scrub { flex: 1; accent-color: #ffb347; min-width: 0; }
  #time { min-width: 120px; text-align: right; opacity: .8; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<audio id="vo" src="soundtrack.m4a" preload="auto"></audio>
<div id="ui">
  <button id="play" aria-label="Play / pause">▶</button>
  <input id="scrub" type="range" min="0" max="128.5" step="0.01" value="0" aria-label="Timeline">
  <span id="time">000.0 / 128.5</span>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   THE DOUBLE-SLIT EXPERIMENT — WHEN REALITY BECOMES STRANGE
   A deterministic film: renderFrame(t) is a pure function of time, so it
   renders frame-exact at 24 fps and stays locked to the narration.
   Physics used for every image:
     wave field   ψ(r) = Σⱼ e^{ik rⱼ} / √rⱼ            (two coherent sources)
     detector     P(z) ∝ |a₁(z) + a₂(z) e^{iφ(z)}|²     (no which-path info)
     which-path   P(z) ∝ |a₁(z)|² + |a₂(z)|²             (paths distinguishable)
   Electrons are only ever shown as localized emission and detection events.
   ===================================================================== */
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
const LEAD = 0.6, q = x => x + LEAD;            // narration starts at 0.6 s
const DURATION = 128.5; window.__DURATION = DURATION;
const PORTRAIT = params.has('portrait');
const LW = PORTRAIT ? 1080 : 1920, LH = PORTRAIT ? 1920 : 1080;
const PY_ = y => PORTRAIT ? y + 600 : y;   // lower-third text placement

const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d')]; };
const [fg, C] = mk();
let W = 0, H = 0, S = 1, FOCAL = 1;

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const sm5 = k => { k = clamp(k); return k * k * k * (k * (k * 6 - 15) + 10); };
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const win = (t, a, b, fi, fo) => ss(a, a + fi, t) * (1 - ss(b - fo, b, t));
const frac = x => x - Math.floor(x);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(R) { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); }
function chan(keys, t, e = ease) { if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) { const [t0, v0] = keys[i], [t1, v1] = keys[i + 1]; if (t <= t1) return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], e((t - t0) / (t1 - t0)))) : lerp(v0, v1, e((t - t0) / (t1 - t0))); }
  return keys[keys.length - 1][1]; }
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a).toFixed(4)})`;
const mixc = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const sinc = x => Math.abs(x) < 1e-6 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x);

/* ---------- palette ---------- */
const COL = { white: [255, 252, 246], amber: [255, 168, 58], gold: [255, 206, 92], cobalt: [40, 80, 255], uv: [124, 58, 255], cyan: [70, 232, 255],
  verm: [255, 72, 38], turq: [40, 230, 200], indigo: [64, 44, 170], silver: [196, 206, 228], violet: [160, 96, 255], ice: [200, 236, 255], dim: [90, 96, 120] };

/* ---------- sprites ---------- */
let GLOW = {}, NOISE;
function makeGlow(rgb, size, hard) { const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (let k = 0; k <= 16; k++) { const x = k / 16, a = (hard ? Math.exp(-x * x * 14) : Math.exp(-x * x * 5.2)) * (x >= 1 ? 0 : 1), wm = Math.exp(-x * x * (hard ? 60 : 22));
    gr.addColorStop(x, `rgba(${Math.round(lerp(rgb[0], 255, wm))},${Math.round(lerp(rgb[1], 255, wm))},${Math.round(lerp(rgb[2], 255, wm))},${a.toFixed(4)})`); }
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c; }
function makeNoise() { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const id = g.createImageData(256, 256); const R = rng(77);
  for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); return c; }
function glowPx(x, y, r, a, key) { if (a <= 0.002 || r <= 0.05) return; C.globalAlpha = Math.min(1, a); C.drawImage(GLOW[key], x - r, y - r, 2 * r, 2 * r); }
function dotPx(x, y, r, a, key) { if (a <= 0.002 || r <= 0.05) return; C.globalAlpha = Math.min(1, a); C.drawImage(GLOW[key + '_h'], x - r, y - r, 2 * r, 2 * r); }

/* ---------- camera ---------- */
const cam = { tx: 0, ty: 0, tz: 0, dist: 5, cy: 1, sy: 0, cp: 1, sp: 0, ox: 0, oy: 0, px: 0, py: 0, pz: 0 };
function setCam(tg, dist, yaw, pitch) { cam.tx = tg[0]; cam.ty = tg[1]; cam.tz = tg[2]; cam.dist = dist; cam.cy = Math.cos(yaw); cam.sy = Math.sin(yaw); cam.cp = Math.cos(pitch); cam.sp = Math.sin(pitch);
  cam.px = cam.tx + dist * cam.sy * cam.cp; cam.py = cam.ty + dist * cam.sp; cam.pz = cam.tz + dist * cam.cy * cam.cp; }
let PX = 0, PY = 0, PD = 0;
function project(x, y, z) {
  const dx = x - cam.tx, dy = y - cam.ty, dz = z - cam.tz;
  const x1 = dx * cam.cy - dz * cam.sy, z1 = dx * cam.sy + dz * cam.cy;
  const y2 = dy * cam.cp - z1 * cam.sp, z2 = dy * cam.sp + z1 * cam.cp;
  const d = cam.dist - z2; if (d < 0.05) return false;
  PD = d; PX = W * 0.5 + cam.ox * S + FOCAL * x1 / d; PY = H * 0.5 + cam.oy * S - FOCAL * y2 / d; return true; }
const onScreen = m => PX > -m && PX < W + m && PY > -m && PY < H + m;

/* ---------- batched lines ---------- */
class Lines {
  constructor() { this.b = new Map(); }
  add(x1, y1, x2, y2, a, key) { if (a < 0.004) return; const q2 = Math.min(15, Math.floor(a * 16)); const k = key + '|' + q2; let arr = this.b.get(k); if (!arr) { arr = []; this.b.set(k, arr); } arr.push(x1, y1, x2, y2); }
  add3(p, r, a, key) { if (a < 0.004) return; if (!project(p[0], p[1], p[2])) return; const x1 = PX, y1 = PY; if (!project(r[0], r[1], r[2])) return; this.add(x1, y1, PX, PY, a, key); }
  flush(passes, mul = 1) { C.lineCap = 'round'; C.globalAlpha = 1;
    for (const [w, am, tw] of passes) { C.lineWidth = Math.max(0.5, w * S);
      for (const [k, arr] of this.b) { const i = k.indexOf('|'), key = k.slice(0, i), q2 = +k.slice(i + 1); const a = (q2 + 0.5) / 16 * am * mul; if (a < 0.002) continue;
        C.strokeStyle = rgba(mixc(COL[key], [255, 255, 255], tw), a); C.beginPath(); for (let j = 0; j < arr.length; j += 4) { C.moveTo(arr[j], arr[j + 1]); C.lineTo(arr[j + 2], arr[j + 3]); } C.stroke(); } }
    this.b.clear(); }
}
const GLW = [[7, 0.07, 0], [2.4, 0.26, 0.15], [0.9, 0.8, 0.55]];
const FINE = [[2.2, 0.18, 0], [0.8, 0.75, 0.3]];

/* ---------- solids: lit boxes (painter-sorted faces) ---------- */
const LIGHT = (() => { const v = [-0.45, 0.75, 0.5], l = Math.hypot(...v); return v.map(x => x / l); })();
const faces = [];
function box(c, s, col, a, edge = 'silver', edgeA = 0.35, emissive = 0) {
  if (a <= 0.003) return;
  const [cx, cy, cz] = c, [hx, hy, hz] = [s[0] / 2, s[1] / 2, s[2] / 2];
  const F = [[[1, 0, 0], [[hx, -hy, -hz], [hx, hy, -hz], [hx, hy, hz], [hx, -hy, hz]]], [[-1, 0, 0], [[-hx, -hy, hz], [-hx, hy, hz], [-hx, hy, -hz], [-hx, -hy, -hz]]],
    [[0, 1, 0], [[-hx, hy, -hz], [-hx, hy, hz], [hx, hy, hz], [hx, hy, -hz]]], [[0, -1, 0], [[-hx, -hy, hz], [-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz]]],
    [[0, 0, 1], [[-hx, -hy, hz], [hx, -hy, hz], [hx, hy, hz], [-hx, hy, hz]]], [[0, 0, -1], [[hx, -hy, -hz], [-hx, -hy, -hz], [-hx, hy, -hz], [hx, hy, -hz]]]];
  for (const [n, vs] of F) {
    const fc = [cx + n[0] * hx, cy + n[1] * hy, cz + n[2] * hz];
    if ((cam.px - fc[0]) * n[0] + (cam.py - fc[1]) * n[1] + (cam.pz - fc[2]) * n[2] <= 0) continue;
    const pts = []; let ok = true; for (const v of vs) { if (!project(cx + v[0], cy + v[1], cz + v[2])) { ok = false; break; } pts.push([PX, PY]); } if (!ok) continue;
    project(fc[0], fc[1], fc[2]); const lam = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
    faces.push({ d: PD, pts, col: col.map(v => v * (0.3 + 1.1 * lam) + emissive * 40), a, edge, edgeA: edgeA * (0.55 + 0.9 * lam), n }); }
}
function flushFaces() {
  faces.sort((p, r) => r.d - p.d);
  for (const f of faces) { C.globalCompositeOperation = 'source-over'; C.globalAlpha = Math.min(1, f.a);
    const g = C.createLinearGradient(f.pts[0][0], f.pts[0][1], f.pts[2][0], f.pts[2][1]); g.addColorStop(0, rgba(f.col.map(v => v * 0.75), 1)); g.addColorStop(1, rgba(f.col, 1));
    C.fillStyle = g; C.beginPath(); C.moveTo(f.pts[0][0], f.pts[0][1]); for (let i = 1; i < 4; i++) C.lineTo(f.pts[i][0], f.pts[i][1]); C.closePath(); C.fill();
    C.globalCompositeOperation = 'lighter'; C.globalAlpha = 1; C.strokeStyle = rgba(COL[f.edge], Math.min(1, f.edgeA * f.a)); C.lineWidth = Math.max(0.6, 1.0 * S); C.stroke(); }
  faces.length = 0; C.globalCompositeOperation = 'lighter'; C.globalAlpha = 1;
}
function quad3(P4, fill, a, edge, edgeA) {
  const sp = []; for (const p of P4) { if (!project(p[0], p[1], p[2])) return; sp.push([PX, PY]); }
  C.globalAlpha = 1; C.beginPath(); C.moveTo(sp[0][0], sp[0][1]); for (let i = 1; i < 4; i++) C.lineTo(sp[i][0], sp[i][1]); C.closePath();
  if (fill) { C.fillStyle = typeof fill === 'function' ? fill(sp) : rgba(fill, a); C.fill(); }
  if (edge) { C.strokeStyle = rgba(COL[edge], edgeA); C.lineWidth = Math.max(0.6, S); C.stroke(); }
}

/* ---------- physics: the detector distributions ---------- */
// world B (electron apparatus): screen spans z ∈ [-3, 3]
const ZJ = 0.42, WD = 1.05, SFR = 0.36;               // slit images, single-slit width, fringe spacing
const amp = (z, j) => sinc((z - (j ? ZJ : -ZJ)) / WD);
const Pint = z => { const a1 = amp(z, 0), a2 = amp(z, 1); return a1 * a1 + a2 * a2 + 2 * a1 * a2 * Math.cos(2 * Math.PI * z / SFR); };
const Pwp = z => { const a1 = amp(z, 0), a2 = amp(z, 1); return a1 * a1 + a2 * a2; };
let PMAX_I = 0, PMAX_W = 0;
function sampler(f, zmax, R) { let m = 0; for (let i = 0; i <= 4000; i++) m = Math.max(m, f(-zmax + 2 * zmax * i / 4000)); m *= 1.02;
  return () => { for (;;) { const z = (R() * 2 - 1) * zmax; if (R() * m < f(z)) return z; } }; }

/* ---------- event schedules ---------- */
let EV3 = [], EV4 = [], CL = [], EV6 = null;
const N3 = 16000, N4 = 9000;
// N(t) for electrons, log-linear through narration-timed anchors
const NK3 = [[q(47.8), 5], [q(50.8), 55], [q(52.6), 420], [q(54.7), 3000], [q(58.0), 11500], [q(61.0), 16000]];
const FIRST3 = [q(44.15), q(45.55), q(46.6), q(47.2), q(47.75)];
const NK4 = [[q(71.6), 1], [q(72.6), 30], [q(73.6), 500], [q(75.5), 4000], [q(79.0), 9000]];
function invN(keys, n) { for (let i = 0; i < keys.length - 1; i++) { const [t0, n0] = keys[i], [t1, n1] = keys[i + 1]; if (n <= n1) return t0 + (t1 - t0) * (Math.log(n) - Math.log(n0)) / (Math.log(n1) - Math.log(n0)); } return keys[keys.length - 1][0]; }
function init() {
  const R = rng(1801); // Young, 1801
  for (let i = 0; i < 6000; i++) PMAX_I = Math.max(PMAX_I, Pint(-3 + 6 * i / 6000)), PMAX_W = Math.max(PMAX_W, Pwp(-3 + 6 * i / 6000));
  const sI = sampler(Pint, 3, R), sW = sampler(Pwp, 3, R);
  const yS = () => { for (;;) { const y = gauss(R) * 0.62; if (Math.abs(y) < 1.65) return y; } };
  for (let i = 0; i < N3; i++) { const t = i < 5 ? FIRST3[i] : invN(NK3, i + 1); EV3.push({ t, z: sI(), y: yS(), r: R() }); }
  for (let i = 0; i < N4; i++) { const t = invN(NK4, i + 1); const z = sW(); const s = R() < amp(z, 1) ** 2 / (amp(z, 0) ** 2 + amp(z, 1) ** 2) ? 1 : 0; EV4.push({ t, z, y: yS(), s, r: R() }); }
  // classical particles (scene 1): a broad parallel beam aimed at the barrier
  for (let i = 0; i < 2100; i++) { const t0 = q(6.9) + i / 2100 * 7.6 + R() * 0.02; const z = (R() * 2 - 1) * 0.72, y = (R() * 2 - 1) * 1.05;
    const pass = Math.abs(z - 0.5) < 0.07 ? 1 : Math.abs(z + 0.5) < 0.07 ? -1 : 0; CL.push({ t0, z, y, pass, dz: gauss(R) * 0.018, dy: gauss(R) * 0.03, r: R() }); }
  EV6 = { z: 0.36 * 2, y: 0.12 };
}

/* =====================================================================
   SCENE 1 — THE PERFECTLY ORDINARY WORLD
   ===================================================================== */
const BAR1 = 0, SCR1 = 3.0, SLITZ1 = 0.5, SLITW1 = 0.14;
function barrier(x, slitZ, slitW, hy, depthZ, thick, a, col = [13, 13, 17], edge = 'silver', edgeA = 0.6) {
  const zin = slitZ - slitW / 2, zout = slitZ + slitW / 2;
  box([x, 0, 0], [thick, hy * 2, 2 * (zin)], col, a, edge, edgeA);                                            // middle
  box([x, 0, (zout + depthZ) / 2], [thick, hy * 2, depthZ - zout], col, a, edge, edgeA);                      // +z side
  box([x, 0, -(zout + depthZ) / 2], [thick, hy * 2, depthZ - zout], col, a, edge, edgeA);                     // -z side
}
function sceneOne(t, A) {
  // the single point and its line
  const p0 = q(2.7), p1 = q(6.2);
  const px = lerp(-6.2, BAR1, ease((t - p0) / (p1 - p0)) * 0.999 + 0.0) , pIn = ss(q(0.6), q(1.8), t);
  const lineA = A * ss(p0, p0 + 0.3, t);
  const L = new Lines();
  if (t > p0) { const xe = t < p1 ? px : lerp(BAR1, SCR1, clamp((t - p1) / 0.55)); L.add3([-6.2, 0, SLITZ1], [xe, 0, SLITZ1], 0.75 * lineA * (1 - ss(q(9.5), q(13), t)), 'white'); }
  // barrier + screen light up
  const barA = A * ss(q(4.4), q(5.9), t), scrA = A * ss(q(6.0), q(7.2), t) * (1 - ss(q(16.0), q(17.2), t));
  // classical source (a calm block on the left)
  const srcA = A * ss(q(6.4), q(7.6), t) * (1 - ss(q(14.6), q(16.2), t));
  // classical hits: two concentrations; then they stretch into two slits
  const st = ss(q(15.2), q(16.8), t);
  const hits = [];
  for (const p of CL) { if (!p.pass) continue; const ta = p.t0 + (SCR1 + 5.0) / 3.2; if (t < ta) continue; const age = t - ta;
    let z = p.z + p.dz * 8, y = p.y + p.dy * 8; z = lerp(z, p.pass * SLITZ1, st); y = lerp(y, clamp(p.y * 1.25, -1.25, 1.25), st);
    hits.push([SCR1 - 0.01, y, z, age]); }
  // particles in flight
  const beyond = [], before = [];
  for (const p of CL) { if (t < p.t0) continue; const x = -5.0 + (t - p.t0) * 3.2; const ta = p.t0 + (SCR1 + 5.0) / 3.2;
    if (x < BAR1) before.push([x, p.y, p.z]); else if (p.pass && t < ta) beyond.push([x, p.y + p.dy * (x - BAR1) * 2.6, p.z + p.dz * (x - BAR1) * 2.6]);
    else if (!p.pass && x < BAR1 + 0.35) before.push([BAR1 - 0.07, p.y, p.z, 1 - (x - BAR1) / 0.35]); }
  // painter's order (camera on the source side): screen → hits / particles beyond → barrier & source → particles before
  box([SCR1 + 0.05, 0, 0], [0.08, 2.6, 3.2], [10, 10, 13], scrA, 'amber', 0.55); flushFaces();
  C.globalCompositeOperation = 'lighter';
  for (const [x, y, z, age] of hits) if (project(x, y, z)) { const fl = Math.exp(-age * 5); dotPx(PX, PY, (2.8 + 7 * fl) * S, A * (0.85 + 0.15 * fl) * (1 - ss(q(16.6), q(18.0), t)), fl > 0.3 ? 'white' : 'amber'); }
  for (const [x, y, z] of beyond) if (project(x, y, z)) dotPx(PX, PY, 2.6 * S, A, 'white');
  if (st > 0) for (const sz of [-SLITZ1, SLITZ1]) { const LL = new Lines(); LL.add3([SCR1 - 0.02, -1.25 * st, sz], [SCR1 - 0.02, 1.25 * st, sz], st * A, 'gold'); LL.flush(GLW, 1.2); }
  box([-5.3, 0, 0], [0.5, 2.3, 2.1], [14, 13, 12], srcA, 'amber', 0.75);
  barrier(BAR1, SLITZ1, SLITW1, 1.25, 1.6, 0.12, barA * (1 - ss(q(15.6), q(17.6), t)), [13, 13, 17], 'white', 0.55);
  flushFaces();
  for (const [x, y, z, fade] of before) if (project(x, y, z)) { if (fade !== undefined) glowPx(PX, PY, 6 * S, A * 0.4 * fade, 'amber'); else dotPx(PX, PY, 2.5 * S, A, 'white'); }
  L.flush(GLW, 1);
  // the point itself
  const pA = A * pIn * (1 - ss(p1, p1 + 0.6, t));
  if (pA > 0 && project(t < p1 ? px : lerp(BAR1, SCR1, clamp((t - p1) / 0.55)), 0, SLITZ1)) { glowPx(PX, PY, 26 * S, pA * 0.5, 'white'); dotPx(PX, PY, 5 * S, pA, 'white'); }
  // the first classical impact
  if (t > p1 + 0.55 && project(SCR1 - 0.01, 0, SLITZ1)) { const age = t - p1 - 0.55; glowPx(PX, PY, 60 * S * Math.exp(-age * 2), A * Math.exp(-age * 2) * 0.6, 'amber'); }
  // soft amber key light behind the barrier (volumetric haze)
  if (project(BAR1 + 0.4, 0.2, 0)) glowPx(PX, PY, 420 * S, 0.07 * barA * (1 - ss(q(15.6), q(17.6), t)), 'amber');
}

/* =====================================================================
   SCENE 2 — WHEN WAVES INTERFERE   (barrier at x = 3, screen at x = 9.4)
   ===================================================================== */
const B2 = SCR1, S2X = 9.4, D2 = 0.5, LAM = 0.22, K2 = 2 * Math.PI / LAM;
const OM = K2 * 0.32;                     // phase speed 0.32 u/s (calm ripples)
const T_SL = q(21.7), VF = 0.85;          // wave reaches slits; envelope (front) speed
function field(x, z, t) { // returns [Re ψ, |ψ|²] for the diffracted wave behind the barrier
