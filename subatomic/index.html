<!doctype html>
<html lang="en">
<head>

</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <button id="play" aria-label="Play / pause">❚❚</button>
  <input id="scrub" type="range" min="0" max="40" step="0.01" value="0" aria-label="Timeline">
  <span id="time">00.00 / 40.00</span>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   THE SUBATOMIC UNIVERSE — A Colorful Journey into Matter
   40 s deterministic motion-graphics film. renderFrame(t) is a pure
   function of time. Logical canvas 1920×1080, scaled to any output.
   Story: carbon atom → dive into a proton → it dissolves and a neutron
   forms → the neutron β-decays, emitting an electron → the electron
   settles into a cloud around the remaining proton → nucleons gather
   into carbon again.
   ===================================================================== */
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
const DURATION = 40; window.__DURATION = DURATION;
const LW = 1920, LH = 1080;
const N_CLOUD = +params.get('n') || (RENDER ? 26000 : 18000);
const N_SWARM = RENDER ? 5200 : 3600;
const N_BOKEH = RENDER ? 1500 : 1000;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const fg = document.createElement('canvas'); const fctx = fg.getContext('2d');
let W = 0, H = 0, S = 1, FOCAL = 1;
let C = fctx; // current drawing context for foreground helpers

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const sm5 = k => { k = clamp(k); return k * k * k * (k * (k * 6 - 15) + 10); };
const easeInOut = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut3 = k => { k = clamp(k); return 1 - Math.pow(1 - k, 3); };
const win = (t, a, b, fi, fo) => ss(a, a + fi, t) * (1 - ss(b - fo, b, t));
const frac = x => x - Math.floor(x);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(R) { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); }

function chan(keys, t, ease = easeInOut) {

}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a).toFixed(4)})`;
const mixc = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];

/* ---------- hydrogen-like orbitals ---------- */
function laguerre(k, a, x) { if (k === 0) return 1; let L0 = 1, L1 = 1 + a - x; for (let j = 1; j < k; j++) { const L2 = ((2 * j + 1 + a - x) * L1 - (j + a) * L0) / (j + 1); L0 = L1; L1 = L2; } return L1; }

// rejection-sample |ψ|²; writes into arrays at offset, with radial scale; orbital z → world y
function sampleInto(out, off, count, n, l, m, scale, seed, rmax) {

  const R = rng(seed); let maxW = 0, maxD = 0;
  const dir = () => { const cz = R() * 2 - 1, th = R() * 6.283185, sr = Math.sqrt(1 - cz * cz); return [sr * Math.cos(th), sr * Math.sin(th), cz]; };

    if (R() * maxW < w) { const i = off + k; out.X[i] = x * scale; out.Y[i] = z * scale; out.Z[i] = y * scale; out.D[i] = Math.min(1, Math.pow(v * v / maxD, 0.6)); out.SG[i] = v >= 0 ? 1 : -1; k++; }
  }
}
function newCloud(n) { return { X: new Float32Array(n), Y: new Float32Array(n), Z: new Float32Array(n), D: new Float32Array(n), SG: new Int8Array(n) }; }
function normalise(cl, target) {
  const r = []; for (let i = 0; i < cl.X.length; i++) r.push(Math.hypot(cl.X[i], cl.Y[i], cl.Z[i])); r.sort((a, b) => a - b);

}
// shuffle so particle i of every layout is a random member (staggering looks organic)
function shuffleCloud(cl, seed) { const R = rng(seed); const n = cl.X.length;
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); for (const k of ['X', 'Y', 'Z', 'D', 'SG']) { const t = cl[k][i]; cl[k][i] = cl[k][j]; cl[k][j] = t; } } }

/* ---------- colours ---------- */
const COL = {
  white: [255, 255, 255], gold: [255, 214, 92], orange: [255, 128, 40], red: [255, 70, 50], pink: [255, 70, 190], magenta: [235, 60, 255],
  violet: [140, 80, 255], blue: [60, 120, 255], cyan: [80, 230, 255], teal: [40, 225, 200], emerald: [30, 210, 130], ice: [200, 235, 255],
};
const PROTON_C = [255, 110, 52], NEUTRON_C = [52, 214, 205], UP_C = [255, 214, 80], DOWN_C = [255, 72, 196], ELECTRON_C = [120, 170, 255];
// scene palettes (dark → bright) for the flowing background
const PAL = [
  ['#05052a', '#1638c8', '#6a22e0', '#e02a9e', '#ff7ad6'].map(hex),                 // 1 blue / violet / magenta
  ['#2a0402', '#9e1a0c', '#e2531a', '#ff9a24', '#ffd451'].map(hex),                 // 2 red / orange / gold
  ['#01122a', '#06506e', '#0a9a78', '#18d6c4', '#7af5e2'].map(hex),                 // 3 deep blue / emerald / turquoise
  ['#060630', '#1a3cff', '#7422ff', '#e02ad0', '#ff74e0'].map(hex),                 // 4 electric blue / violet / neon pink
  ['#0b0630', '#2a48ff', '#a42cff', '#ff3a9e', '#ff9a2a', '#ffd84f', '#1ce0c8'].map(hex), // 5 all of them
];
const SCENE_ACCENT = [COL.magenta, COL.orange, COL.teal, COL.pink, COL.gold];
function sceneWeights(t) {
  const w = [
    1 - ss(6.2, 8.4, t),
    ss(6.2, 8.4, t) * (1 - ss(15.0, 17.4, t)),
    ss(15.0, 17.4, t) * (1 - ss(24.4, 26.4, t)),
    ss(24.4, 26.4, t) * (1 - ss(33.4, 35.6, t)),
    ss(33.4, 35.6, t),

  const s = w.reduce((a, b) => a + b, 0) || 1; return w.map(v => v / s);
}

/* ---------- precomputed data ---------- */
let CLOUD_C, CLOUD_H, PM, SW, BK, NUCL, SEL = 0;
const R0 = 0.115; // nucleon radius inside the (enlarged) nucleus
function init() {
  const R = rng(2024);
  // carbon-like multi-electron cloud: 1s core + 2s + 2p_x + 2p_z (effective-charge scaled)
  CLOUD_C = newCloud(N_CLOUD);
  const q = Math.floor(N_CLOUD * 0.12), rest = N_CLOUD - q, a = Math.floor(rest / 3), b = a, c = rest - a - b;
  sampleInto(CLOUD_C, 0, q, 1, 0, 0, 1 / 5.7, 1, 8);
  sampleInto(CLOUD_C, q, a, 2, 0, 0, 1 / 3.1, 2, 22);
  sampleInto(CLOUD_C, q + a, b, 2, 1, 1, 1 / 3.1, 3, 18);
  sampleInto(CLOUD_C, q + a + b, c, 2, 1, 0, 1 / 3.1, 4, 18);
  normalise(CLOUD_C, 1.55); shuffleCloud(CLOUD_C, 9);
  // hydrogen 2p_z (excited state: a cloud with visible structure)
  CLOUD_H = newCloud(N_CLOUD); sampleInto(CLOUD_H, 0, N_CLOUD, 2, 1, 0, 1, 5, 18); normalise(CLOUD_H, 1.35); shuffleCloud(CLOUD_H, 10);
  PM = { u: new Float32Array(N_CLOUD), u2: new Float32Array(N_CLOUD), ph: new Float32Array(N_CLOUD), fr: new Float32Array(N_CLOUD),
         sx: new Float32Array(N_CLOUD), sy: new Float32Array(N_CLOUD), sz: new Float32Array(N_CLOUD), gx: new Float32Array(N_CLOUD), gy: new Float32Array(N_CLOUD), gz: new Float32Array(N_CLOUD) };
  for (let i = 0; i < N_CLOUD; i++) {
    PM.u[i] = R(); PM.u2[i] = R(); PM.ph[i] = R() * 6.283; PM.fr[i] = 0.6 + R() * 2;
    const th = R() * 6.283, cz = R() * 2 - 1, sr = Math.sqrt(1 - cz * cz), rad = 2.5 + R() * 4.5; // scattered start
    PM.sx[i] = rad * sr * Math.cos(th); PM.sy[i] = rad * cz * 0.7; PM.sz[i] = rad * sr * Math.sin(th);
    PM.gx[i] = gauss(R); PM.gy[i] = gauss(R); PM.gz[i] = gauss(R);
  }
  // swarm used for proton → neutron transformation
  SW = { ux: new Float32Array(N_SWARM), uy: new Float32Array(N_SWARM), uz: new Float32Array(N_SWARM), cx: new Float32Array(N_SWARM), cy: new Float32Array(N_SWARM), cz: new Float32Array(N_SWARM), u: new Float32Array(N_SWARM), ph: new Float32Array(N_SWARM) };
  for (let i = 0; i < N_SWARM; i++) {
    const th = R() * 6.283, cz = R() * 2 - 1, sr = Math.sqrt(1 - cz * cz);
    SW.ux[i] = sr * Math.cos(th); SW.uy[i] = cz; SW.uz[i] = sr * Math.sin(th);
    const rad = 1.4 + Math.abs(gauss(R)) * 0.9; SW.cx[i] = SW.ux[i] * rad + gauss(R) * 0.3; SW.cy[i] = SW.uy[i] * rad * 0.8 + gauss(R) * 0.3; SW.cz[i] = SW.uz[i] * rad + gauss(R) * 0.3;
    SW.u[i] = R(); SW.ph[i] = R() * 6.283;
  }

  BK = [];
  for (let i = 0; i < N_BOKEH; i++) {
    const th = R() * 6.283, cz = R() * 2 - 1, sr = Math.sqrt(1 - cz * cz), rad = 2.2 + Math.pow(R(), 0.8) * 14;
    BK.push({ x: rad * sr * Math.cos(th), y: rad * cz * 0.75, z: rad * sr * Math.sin(th), b: R(), ph: R() * 6.283, vx: (R() - .5) * .12, vy: (R() - .25) * .08, vz: (R() - .5) * .1, ci: Math.floor(R() * 3) });

  const P = []; for (let i = 0; i < 12; i++) P.push([gauss(R) * 0.1, gauss(R) * 0.1, gauss(R) * 0.1]);

      const dx = P[j][0] - P[i][0], dy = P[j][1] - P[i][1], dz = P[j][2] - P[i][2], d = Math.hypot(dx, dy, dz) || 1e-4;

}

/* ---------- sprites ---------- */
let GLOW = {}, BALL = {}, NOISE;
function makeGlow(rgb, size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (let k = 0; k <= 16; k++) { const x = k / 16, a = Math.exp(-x * x * 5.2) * (x >= 1 ? 0 : 1), wm = Math.exp(-x * x * 22);
    gr.addColorStop(x, `rgba(${Math.round(lerp(rgb[0], 255, wm))},${Math.round(lerp(rgb[1], 255, wm))},${Math.round(lerp(rgb[2], 255, wm))},${a.toFixed(4)})`); }
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
function makeBall(rgb, size) { // shaded, lit sphere with rim light
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); const r = size / 2;
  g.beginPath(); g.arc(r, r, r * 0.98, 0, Math.PI * 2); g.clip();
  const gr = g.createRadialGradient(r * 0.62, r * 0.58, r * 0.04, r, r, r);
  gr.addColorStop(0, rgba(mixc(rgb, [255, 255, 255], 0.85), 1)); gr.addColorStop(0.28, rgba(mixc(rgb, [255, 255, 255], 0.25), 1));
  gr.addColorStop(0.7, rgba(rgb, 1)); gr.addColorStop(1, rgba(mixc(rgb, [0, 0, 0], 0.55), 1));

  rim.addColorStop(0, 'rgba(255,255,255,0)'); rim.addColorStop(0.85, 'rgba(255,255,255,0)'); rim.addColorStop(1, rgba(mixc(rgb, [255, 255, 255], 0.5), 0.55));

function makeNoise() { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const id = g.createImageData(256, 256); const R = rng(77);
  for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); return c; }

/* ---------- camera ---------- */
const cam = { tx: 0, ty: 0, tz: 0, dist: 9, cy: 1, sy: 0, cp: 1, sp: 0, ox: 0, oy: 0, yaw: 0 };
const E_POS = [2.1, 0.35, 0.55];
const K_DIST = [[0, 10], [6.0, 5.7], [8.4, 4.75], [24.5, 4.75], [26.0, 5.9], [28.4, 5.9], [30.6, 5.4], [34.0, 5.4], [36.0, 5.9], [40, 12.5]];
const K_PITCH = [[0, 0.12], [6, 0.16], [8.6, 0.36], [24.4, 0.36], [26.2, 0.16], [30.5, 0.22], [34, 0.22], [37, 0.32]];
const K_OX = [[0, 0], [7.0, 0], [9.4, 230], [33.6, 230], [35.4, 0]];
const K_OY = [[0, -55], [6.0, -55], [8.4, 0], [33.6, 0], [35.4, -55]];

/* ---------- drawing primitives (foreground context C) ---------- */

    proton: PROTON_C, neutron: NEUTRON_C, up: UP_C, down: DOWN_C };

function pickSelected() { // the proton nearest the camera at the start of the dive

}

    renderFrame(t); scrub.value = t; time.textContent = `${t.toFixed(2).padStart(5, '0')} / 40.00`; requestAnimationFrame(tick); };

boot();
