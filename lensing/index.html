<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravitational Lensing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #eef3ff; font-family: Inter, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { display: block; background: #000; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 24px 22px; display: flex; gap: 16px; align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0)); transition: opacity .5s ease; font: 300 12px/1 Inter, sans-serif; letter-spacing: .12em; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui button { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 13px; flex: none; }
  #scrub { flex: 1; accent-color: #ffcc66; min-width: 0; }
  #time { min-width: 120px; text-align: right; opacity: .8; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<audio id="snd" src="soundtrack.m4a" preload="auto"></audio>
<div id="ui">
  <button id="play" aria-label="Play / pause">▶</button>
  <input id="scrub" type="range" min="0" max="102.5" step="0.01" value="0" aria-label="Timeline">
  <span id="time">000.0 / 102.5</span>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   GRAVITATIONAL LENSING — THE UNIVERSE AS A LENS
   Deterministic film: renderFrame(t) is a pure function of time.
   Every lensed image is ray-traced per pixel with the lens equation
        β = θ − α(θ)
   (θ: position on the sky, β: true source position, α: deflection).
   Lens models: singular isothermal ellipsoid (Kormann et al. 1994),
   cored/truncated isothermal cluster members, and a cosmic-web mass map.
   Side-view light paths are integrated trajectories, shot to reach the observer.
   ===================================================================== */
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
const LEAD = 0.6, q = x => x + LEAD;
const DURATION = 102.5; window.__DURATION = DURATION;
const PORTRAIT = params.has('portrait');
const LW = PORTRAIT ? 1080 : 1920, LH = PORTRAIT ? 1920 : 1080;
const PY_ = y => PORTRAIT ? y + 600 : y;
const RW = PORTRAIT ? (RENDER ? 720 : 450) : (RENDER ? 1280 : 800), RH = PORTRAIT ? Math.round(RW * 16 / 9) : Math.round(RW * 9 / 16);

const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d')]; };
const [fg, C] = mk();
let W = 0, H = 0, S = 1, FOCAL = 1;

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const sm5 = k => { k = clamp(k); return k * k * k * (k * (k * 6 - 15) + 10); };
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const win = (t, a, b, fi, fo) => ss(a, a + fi, t) * (1 - ss(b - fo, b, t));
const frac = x => x - Math.floor(x);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(R) { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); }
function chan(keys, t, e = ease) { if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) { const [t0, v0] = keys[i], [t1, v1] = keys[i + 1]; if (t <= t1) { const k = e((t - t0) / (t1 - t0)); return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], k)) : lerp(v0, v1, k); } }
  return keys[keys.length - 1][1]; }
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a).toFixed(4)})`;
const mixc = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];

const COL = { white: [255, 250, 244], gold: [255, 196, 92], amber: [255, 158, 60], turq: [46, 232, 214], cyan: [96, 220, 255], violet: [150, 92, 255],
  magenta: [236, 70, 210], crimson: [230, 40, 80], indigo: [56, 46, 170], ice: [205, 230, 255], blue: [70, 120, 255] };

/* ---------- glow sprites ---------- */
let GLOW = {};
function makeGlow(rgb, size, hard) { const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (let k = 0; k <= 16; k++) { const x = k / 16, a = (hard ? Math.exp(-x * x * 14) : Math.exp(-x * x * 5.2)) * (x >= 1 ? 0 : 1), wm = Math.exp(-x * x * (hard ? 60 : 22));
    gr.addColorStop(x, `rgba(${Math.round(lerp(rgb[0], 255, wm))},${Math.round(lerp(rgb[1], 255, wm))},${Math.round(lerp(rgb[2], 255, wm))},${a.toFixed(4)})`); }
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c; }
function glowPx(x, y, r, a, key) { if (a <= 0.002 || r <= 0.05) return; C.globalAlpha = Math.min(1, a); C.drawImage(GLOW[key], x - r, y - r, 2 * r, 2 * r); }
function dotPx(x, y, r, a, key) { if (a <= 0.002 || r <= 0.05) return; C.globalAlpha = Math.min(1, a); C.drawImage(GLOW[key + '_h'], x - r, y - r, 2 * r, 2 * r); }

/* =====================================================================
   GALAXY LIGHT PROFILES (shared by sprites and the ray tracer)
   ===================================================================== */
// spiral galaxy in its own frame; u,v in units of the disk extent (r≈1 edge)
function spiralRGB(u, v, g, out, w) {
  const r2 = u * u + v * v; if (r2 > 1.7) return; const r = Math.sqrt(r2);
  const th = Math.atan2(v, u);
  const disk = Math.exp(-r / 0.3);
  const arm = 0.5 + 0.5 * Math.cos(2 * (th - g.wind * Math.log(r + 0.06)) + g.ph); const armM = arm * arm * arm;
  const bulge = Math.exp(-r2 / (2 * g.rb * g.rb));
  let kn = 0; for (let i = 0; i < g.kn.length; i += 3) { const dx = u - g.kn[i], dy = v - g.kn[i + 1]; kn += g.kn[i + 2] * Math.exp(-(dx * dx + dy * dy) * 900); }
  const dust = 1 - 0.55 * Math.exp(-Math.pow((Math.cos(2 * (th - g.wind * Math.log(r + 0.06)) + g.ph - 1.3) - 1) * 2.2, 2)) * Math.exp(-r / 0.5) * (r > 0.08 ? 1 : 0);
  const dI = disk * (0.18 + 1.1 * armM) * dust, b = bulge * 2.2;
  out[0] += w * (b * g.cb[0] + dI * g.cd[0] + kn * g.ck[0]);
  out[1] += w * (b * g.cb[1] + dI * g.cd[1] + kn * g.ck[1]);
  out[2] += w * (b * g.cb[2] + dI * g.cd[2] + kn * g.ck[2]);
}
function ellipRGB(u, v, g, out, w) { // de Vaucouleurs-like elliptical
  const r2 = u * u + v * v; if (r2 > 2.2) return; const r = Math.sqrt(r2) + 0.004;
  const I = Math.exp(-7.67 * (Math.pow(r / g.re, 0.25) - 1)) * 0.012 + 0.6 * Math.exp(-r2 / 0.0016);
  const fall = 1 - ss(0.9, 1.45, r); const k = w * I * fall;
  out[0] += k * g.c[0]; out[1] += k * g.c[1]; out[2] += k * g.c[2];
}
function makeSpiral(R, size, pal) {
  const kn = []; const nk = 10 + Math.floor(R() * 14);
  const wind = 1.4 + R() * 1.6, ph = R() * 6.28;
  for (let i = 0; i < nk; i++) { const r = 0.15 + R() * 0.65, th0 = wind * Math.log(r + 0.06) - ph / 2 + (R() < 0.5 ? 0 : Math.PI) + gauss(R) * 0.12; kn.push(r * Math.cos(th0), r * Math.sin(th0), 0.6 + R() * 1.6); }
  const P = pal || [[255, 214, 150], [110, 170, 255], [235, 90, 220]];
  return { type: 's', wind, ph, rb: 0.06 + R() * 0.05, kn, cb: P[0].map(x => x / 255), cd: P[1].map(x => x / 255), ck: P[2].map(x => x / 255), size };
}
function makeElliptical(R, size) { const warm = 0.85 + R() * 0.15; return { type: 'e', re: 0.32 + R() * 0.15, c: [1.0 * warm, 0.78 * warm, 0.52 * warm], size }; }
function galaxyRGB(u, v, g, out, w) { if (g.type === 's') spiralRGB(u, v, g, out, w); else ellipRGB(u, v, g, out, w); }
// sprite canvases for the 3D galaxy field
function galaxySprite(g, incl, px) {
  const c = document.createElement('canvas'); c.width = c.height = px; const x = c.getContext('2d'); const id = x.createImageData(px, px); const o = [0, 0, 0];
  for (let j = 0; j < px; j++) for (let i = 0; i < px; i++) { o[0] = o[1] = o[2] = 0; const u = (i + 0.5) / px * 2.6 - 1.3, v = ((j + 0.5) / px * 2.6 - 1.3) / Math.max(0.18, Math.cos(incl));
    galaxyRGB(u, v, g, o, 1); const k = (i + j * px) * 4;
    const r = 1 - Math.exp(-o[0] * 1.3), gg = 1 - Math.exp(-o[1] * 1.3), b = 1 - Math.exp(-o[2] * 1.3);
    id.data[k] = 255 * r; id.data[k + 1] = 255 * gg; id.data[k + 2] = 255 * b; id.data[k + 3] = 255 * Math.min(1, Math.max(r, gg, b) * 1.2); }
  x.putImageData(id, 0, 0); return c;
}

/* =====================================================================
   LENS MODELS
   ===================================================================== */
// singular isothermal ellipsoid with core s, axis ratio qa, orientation phi
function sieAdd(x, y, L, out, k) {
  const c = Math.cos(L.phi), s0 = Math.sin(L.phi); const dx = x - L.x, dy = y - L.y; const xr = dx * c + dy * s0, yr = -dx * s0 + dy * c;
  let ax, ay;
  if (L.q > 0.995) { const r2 = xr * xr + yr * yr, rr = Math.sqrt(r2 + L.s * L.s); const f = r2 > 1e-12 ? L.b * (rr - L.s) / r2 : 0; ax = f * xr; ay = f * yr; }
  else { const qa = L.q, fq = Math.sqrt(1 - qa * qa), psi = Math.sqrt(qa * qa * (L.s * L.s + xr * xr) + yr * yr), kk = L.b * qa / fq;
    ax = kk * Math.atan(fq * xr / (psi + L.s)); const z = clamp(fq * yr / (psi + qa * qa * L.s), -0.999999, 0.999999); ay = kk * 0.5 * Math.log((1 + z) / (1 - z)); }
  if (L.rt) { const r2 = dx * dx + dy * dy; const tr = 1 / (1 + r2 / (L.rt * L.rt)); ax *= tr; ay *= tr; }
  out[0] += k * (ax * c - ay * s0); out[1] += k * (ax * s0 + ay * c);
}

/* =====================================================================
   THE RAY TRACER (low-res float buffer → tone-mapped → upscaled)
   ===================================================================== */
const [lc, lgx] = mk(); lc.width = RW; lc.height = RH; const LIMG = lgx.createImageData(RW, RH); const LBUF = new Float32Array(RW * RH * 3);
function lensClear() { LBUF.fill(0); }
// view: {cx, cy, hh, rot}; defl(x,y,out) adds deflection; src(bx,by,out,w); light(x,y,out,w)
function lensAdd(view, defl, src, light, w) {
  if (w <= 0.002) return; const sc = 2 * view.hh / RH, cr = Math.cos(view.rot || 0), sr = Math.sin(view.rot || 0); const A = [0, 0];
  for (let py = 0; py < RH; py++) { const yy = (RH / 2 - py - 0.5) * sc;
    for (let px = 0; px < RW; px++) { const xx = (px - RW / 2 + 0.5) * sc; const x = view.cx + xx * cr - yy * sr, y = view.cy + xx * sr + yy * cr;
      A[0] = A[1] = 0; if (defl) defl(x, y, A); const o = [0, 0, 0];
      if (src) src(x - A[0], y - A[1], o, 1); if (light) light(x, y, o, 1);
      const k = (py * RW + px) * 3; LBUF[k] += w * o[0]; LBUF[k + 1] += w * o[1]; LBUF[k + 2] += w * o[2]; } }
}
function lensBlit(alpha, expo = 1) {
  const d = LIMG.data;
  for (let i = 0, j = 0; i < LBUF.length; i += 3, j += 4) {
    d[j] = 255 * Math.pow(1 - Math.exp(-LBUF[i] * expo), 0.9); d[j + 1] = 255 * Math.pow(1 - Math.exp(-LBUF[i + 1] * expo), 0.9); d[j + 2] = 255 * Math.pow(1 - Math.exp(-LBUF[i + 2] * expo), 0.9); d[j + 3] = 255; }
  lgx.putImageData(LIMG, 0, 0);
  C.globalCompositeOperation = 'lighter'; C.globalAlpha = alpha; C.imageSmoothingQuality = 'high'; C.drawImage(lc, 0, 0, W, H); C.globalAlpha = 1;
}
// view helpers (world ↔ screen for lens views)
let VIEW = { cx: 0, cy: 0, hh: 2, rot: 0 };
function w2s(x, y) { const dx = x - VIEW.cx, dy = y - VIEW.cy, c = Math.cos(-VIEW.rot), s = Math.sin(-VIEW.rot); const u = dx * c - dy * s, v = dx * s + dy * c; return [W / 2 + u / VIEW.hh * H / 2, H / 2 - v / VIEW.hh * H / 2]; }

/* =====================================================================
   WORLD DATA
   ===================================================================== */
let FIELD, SPR, CLUSTER1, RAYS, SRC2, LENS2, CL4, WEB;
function init() {
  const R = rng(1919); // Eddington's eclipse expedition, 1919
  // --- galaxy sprites and the 3D galaxy field (scene 1)
  const pals = [[[255, 214, 150], [96, 200, 255], [236, 92, 222]], [[255, 205, 120], [60, 228, 210], [255, 120, 210]], [[255, 226, 170], [130, 150, 255], [200, 110, 255]], [[255, 200, 120], [120, 210, 255], [255, 90, 140]]];
  SPR = [];
  for (let i = 0; i < 14; i++) { const g = i < 10 ? makeSpiral(R, 1, pals[i % 4]) : makeElliptical(R, 1); SPR.push(galaxySprite(g, i < 10 ? R() * 1.1 : 0.3, RENDER ? 160 : 112)); }
  FIELD = []; for (let i = 0; i < (RENDER ? 2600 : 1600); i++) FIELD.push({ x: (R() * 2 - 1) * 70, y: (R() * 2 - 1) * 40, z: -R() * 230 + 20, s: 0.5 + Math.pow(R(), 3) * 3.5, k: Math.floor(R() * 14), rot: R() * 6.28, b: 0.5 + R() * 0.5 });
  CLUSTER1 = []; for (let i = 0; i < 34; i++) CLUSTER1.push({ x: gauss(R) * 0.7, y: Math.abs(gauss(R)) * 0.45, z: gauss(R) * 0.7, s: i === 0 ? 1.1 : 0.18 + R() * 0.32, k: 10 + Math.floor(R() * 4), rot: R() * 6.28 });
  // --- side-view light paths: y'' = −K y / (x² + y² + ε²)^{3/2}; shoot for rays that reach the observer
  const LS = 6, LO = 6, K = 0.15;
  const trace = phi => { const pts = []; let x = -LS, y = 0, vx = Math.cos(phi), vy = Math.sin(phi); const dt = 0.01;
    for (let i = 0; i < 3000 && x < LO + 2.5; i++) { const r2 = x * x + y * y + 0.0016, f = -K / Math.pow(r2, 1.5); vx += f * x * dt * 0; vy += f * y * dt; const vn = Math.hypot(vx, vy); vx /= vn; vy /= vn; x += vx * dt; y += vy * dt; if (i % 4 === 0) pts.push([x, y]); }
    return pts; };
  const yAt = (pts, X) => { for (let i = 1; i < pts.length; i++) if (pts[i][0] >= X) { const a = pts[i - 1], b = pts[i]; return lerp(a[1], b[1], (X - a[0]) / (b[0] - a[0])); } return pts[pts.length - 1][1]; };
  let lo = 0.05, hi = 0.4; for (let it = 0; it < 40; it++) { const m = (lo + hi) / 2; if (yAt(trace(m), LO) > 0) lo = m; else hi = m; } // find φ*: hits the observer
  const phiStar = (lo + hi) / 2;
  RAYS = { LS, LO, star: [trace(phiStar), trace(-phiStar)], fan: [] };
  for (let i = -9; i <= 9; i++) { if (i === 0) continue; const phi = i * 0.042; if (Math.abs(Math.abs(phi) - phiStar) < 0.012) continue; RAYS.fan.push(trace(phi)); }
  RAYS.fan.sort((a, b) => yAt(a, 0) - yAt(b, 0));
  // --- single-lens scenes (2, 3): one foreground elliptical, one background spiral
  LENS2 = { x: 0, y: 0, b: 1.0, q: 0.74, s: 0.03, phi: 0.35 };
  SRC2 = makeSpiral(R, 0.21, [[255, 230, 170], [70, 225, 255], [236, 92, 222]]);
  SRC2.kn = []; for (let i = 0; i < 26; i++) { const r = 0.12 + R() * 0.75, th0 = SRC2.wind * Math.log(r + 0.06) - SRC2.ph / 2 + (R() < 0.5 ? 0 : Math.PI) + gauss(R) * 0.1; SRC2.kn.push(r * Math.cos(th0), r * Math.sin(th0), 0.8 + R() * 2.0); }
  // --- galaxy cluster (scene 4): dark-matter-dominated main halo + member galaxies
  const members = [{ x: 0, y: 0, b: 0.32, q: 1, s: 0.02, phi: 0, rt: 2.5, re: 0.6, size: 0.75 }];
  for (let i = 0; i < 46; i++) { const r = Math.abs(gauss(R)) * 1.5 + 0.25, th = R() * 6.28; members.push({ x: r * Math.cos(th) * 1.25, y: r * Math.sin(th) * 0.85, b: 0.05 + Math.pow(R(), 2) * 0.16, q: 1, s: 0.01, phi: 0, rt: 0.5, re: 0.3 + R() * 0.15, size: 0.12 + R() * 0.2, warm: 0.8 + R() * 0.2 }); }
  const halo = { x: 0.15, y: -0.05, b: 1.55, q: 0.72, s: 0.35, phi: 0.42, rt: 9 };
  const srcs = []; const near = [[0.2, 0.08], [-0.32, 0.18], [0.06, -0.36], [0.55, -0.14], [-0.5, -0.3], [0.38, 0.42]];
  for (let i = 0; i < 110; i++) { const isNear = i < near.length; const x = isNear ? near[i][0] : (R() * 2 - 1) * 6.2, y = isNear ? near[i][1] : (R() * 2 - 1) * 3.6;
    const sp = R() < 0.55 || isNear; const g = sp ? makeSpiral(R, 0, pals[Math.floor(R() * 4)]) : { type: 'c', c: R() < 0.5 ? [0.45, 0.75, 1.0] : [0.95, 0.55, 1.0] };
    g.x = x; g.y = y; g.size = isNear ? 0.12 + R() * 0.08 : 0.04 + Math.pow(R(), 2) * 0.12; g.rot = R() * 6.28; g.inc = 0.3 + R() * 0.6; g.br = isNear ? 1.6 : 0.6 + R(); srcs.push(g); }
  if (PORTRAIT) { const sw = o => { const x = o.x; o.x = o.y; o.y = x; if (o.phi !== undefined) o.phi = Math.PI / 2 - o.phi; if (o.rot !== undefined) o.rot = Math.PI / 2 - o.rot; };
    members.forEach(sw); sw(halo); srcs.forEach(sw); }
  CL4 = { members, halo, srcs };
  CL4.kappa = PORTRAIT ? kappaGrid((x, y, o) => { sieAdd(x, y, halo, o, 1); for (const m of members) sieAdd(x, y, m, o, 1); }, -3.6, 3.6, -6.4, 6.4, 144, 256) : kappaGrid((x, y, o) => { sieAdd(x, y, halo, o, 1); for (const m of members) sieAdd(x, y, m, o, 1); }, -6.4, 6.4, -3.6, 3.6, 256, 144);
  // --- cosmic web (scene 5)
  const nodes = []; for (let i = 0; i < 64; i++) nodes.push({ x: (R() * 2 - 1) * 42, y: (R() * 2 - 1) * 25, m: Math.pow(R(), 2.2) });
  const fil = []; for (let i = 0; i < nodes.length; i++) { const d = nodes.map((n, j) => [Math.hypot(n.x - nodes[i].x, n.y - nodes[i].y), j]).sort((a, b) => a[0] - b[0]); for (let k = 1; k <= 3; k++) if (d[k][0] < 20) fil.push([i, d[k][1]]); }
  const halos = nodes.map(n => ({ x: n.x, y: n.y, b: 0.25 + n.m * 1.25, q: 0.75 + R() * 0.25, s: 0.18, phi: R() * 3.14, rt: 6 }));
  const lightGals = [];
  for (const [i, j] of fil) { const a = nodes[i], b = nodes[j], n = Math.round(Math.hypot(a.x - b.x, a.y - b.y) * 6);
    for (let k = 0; k < n; k++) { const u = R(), sp = 0.7 + 0.6 * Math.sin(Math.PI * u); lightGals.push({ x: lerp(a.x, b.x, u) + gauss(R) * 0.9 * sp, y: lerp(a.y, b.y, u) + gauss(R) * 0.9 * sp, r: 0.03 + Math.pow(R(), 3) * 0.12, w: 0.35 + R() * 0.7 }); }
    halos.push({ x: lerp(a.x, b.x, 0.5), y: lerp(a.y, b.y, 0.5), b: 0.12, q: 0.6, s: 0.6, phi: Math.atan2(b.y - a.y, b.x - a.x), rt: 6 }); }
